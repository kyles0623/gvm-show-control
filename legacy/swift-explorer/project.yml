name: GVMLight
options:
  bundleIdPrefix: local.gvmlight
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
targets:
  GVMLight:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - "Info.plist"
          - "GVMLight.entitlements"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: GVM Light
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.utilities
        NSBluetoothAlwaysUsageDescription: "GVM Light uses Bluetooth to discover and control your GVM LED light."
    entitlements:
      path: Sources/GVMLight.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.bluetooth: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.gvmlight.GVMLight
        PRODUCT_NAME: GVMLight
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES

name: Light report (other GVM models)
description: Tell us whether another GVM light works with the app
labels: [compatibility]
body:
  - type: markdown
    attributes:
      value: |
        Only the GVM 800-RGB has been tested. Reports about other models help everyone.
        Please don't attach raw Bluetooth captures: they include every nearby device. Filtered frames for the
        light only are welcome (see docs/TECHNICAL.md).
  - type: input
    id: model
    attributes:
      label: Light model
      placeholder: GVM 1000D
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Name in the Bluetooth device list
      placeholder: BT_LED
  - type: checkboxes
    id: works
    attributes:
      label: What works?
      options:
        - label: Connects
        - label: Power on/off
        - label: Brightness
        - label: White (color temperature)
        - label: Color (hue/saturation)
        - label: Status shows in "Light reports"
  - type: textarea
    id: notes
    attributes:
      label: Notes and log
      description: Anything odd, plus the last 30–50 lines of the Debug tab log after trying each control.
      render: text
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 1.3.0

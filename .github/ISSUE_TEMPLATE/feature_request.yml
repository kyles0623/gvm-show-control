name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation (show, shoot, rehearsal…) and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: Your idea for how the app could do it. Sketches or examples from other consoles are welcome.
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 1.3.0

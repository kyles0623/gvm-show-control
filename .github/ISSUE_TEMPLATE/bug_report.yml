name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Help → Report a problem** in the app fills in the version and browser for you.
        Please don't attach raw Bluetooth captures (.pklg/.btsnoop): they record every nearby device.
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in the app's lower-right corner (e.g. 1.3.0).
      placeholder: 1.3.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and system
      placeholder: Chrome 130 on macOS 15
    validations:
      required: true
  - type: input
    id: lights
    attributes:
      label: Light(s)
      description: Model and how many.
      placeholder: 2 × GVM 800-RGB
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
      placeholder: |
        1. Started Cops on Light 1
        2. Pressed Tab to Light 2 and moved Brightness
        3. Expected … but …
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: |
        Settings → Advanced → "Show the Debug tab", reproduce the problem, then copy the last 30–50 lines here.
        It shows the commands sent to each light and its replies.
      render: text
  - type: dropdown
    id: frequency
    attributes:
      label: Does it happen every time?
      options:
        - Every time
        - Sometimes
        - Once so far
